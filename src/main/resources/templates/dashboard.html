<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notelify — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: oklch(96% 0.006 270);
      --surface: oklch(100% 0 0);
      --sidebar-bg: oklch(98% 0.004 270);
      --fg: oklch(18% 0.018 270);
      --muted: oklch(50% 0.015 270);
      --border: oklch(90% 0.008 270);
      --accent: oklch(52% 0.19 270);
      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --accent-gradient: linear-gradient(135deg, oklch(52% 0.19 270), oklch(46% 0.18 290));
      --glass-bg: color-mix(in oklch, var(--surface) 70%, transparent);
      --glass-border: color-mix(in oklch, var(--surface) 20%, transparent);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
      --shadow-xl: 0 24px 80px rgba(0,0,0,0.12);
      --success: oklch(52% 0.16 145);
      --danger: oklch(55% 0.18 30);
      --danger-soft: color-mix(in oklch, var(--danger) 12%, transparent);
      --star: oklch(72% 0.18 85);
      --success-soft: color-mix(in oklch, var(--success) 14%, transparent);
      --high: oklch(55% 0.18 30);
      --high-soft: color-mix(in oklch, var(--high) 14%, transparent);
      --medium: oklch(72% 0.18 75);
      --medium-soft: color-mix(in oklch, var(--medium) 14%, transparent);
      --low: oklch(58% 0.12 260);
      --low-soft: color-mix(in oklch, var(--low) 14%, transparent);
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      --radius: 10px;
      --radius-lg: 16px;
      --sidebar-w: 260px;
      --sidebar-collapsed-w: 72px;
      transition: background 0.3s, color 0.3s;
    }
    [data-theme="dark"] {
      --bg: oklch(14% 0.01 270);
      --surface: oklch(20% 0.015 270);
      --sidebar-bg: oklch(17% 0.012 270);
      --fg: oklch(92% 0.005 270);
      --muted: oklch(62% 0.01 270);
      --border: oklch(28% 0.015 270);
      --accent: oklch(62% 0.19 270);
      --accent-soft: color-mix(in oklch, var(--accent) 18%, transparent);
      --glass-bg: color-mix(in oklch, var(--surface) 60%, transparent);
      --glass-border: color-mix(in oklch, var(--surface) 30%, transparent);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.25);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.30);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.35);
      --shadow-xl: 0 24px 80px rgba(0,0,0,0.40);
      --success-soft: color-mix(in oklch, var(--success) 18%, transparent);
      --high-soft: color-mix(in oklch, var(--high) 18%, transparent);
      --medium-soft: color-mix(in oklch, var(--medium) 18%, transparent);
      --low-soft: color-mix(in oklch, var(--low) 18%, transparent);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea { font: inherit; border: none; outline: none; background: none; color: inherit; }
    p { text-wrap: pretty; }
    ::selection { background: var(--accent-soft); }
    svg { display: block; flex-shrink: 0; }

    .app-layout { display: flex; height: 100vh; overflow: hidden; }

    /* ---- Sidebar ---- */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.25s cubic-bezier(0.23,1,0.32,1), background 0.3s;
      overflow: hidden;
      position: relative;
      z-index: 50;
    }
    .sidebar.collapsed { width: var(--sidebar-collapsed-w); }
    .sidebar-inner {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 16px 12px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .sidebar.collapsed .sidebar-inner { padding: 16px 10px; }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-inline: 4px; }
    .sidebar.collapsed .sidebar-header { justify-content: center; padding-inline: 0; }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 19px;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
    }
    .sidebar.collapsed .sidebar-logo span { display: none; }
    .sidebar-toggle {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: grid; place-items: center;
      color: var(--muted);
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .sidebar-toggle:hover { background: var(--accent-soft); color: var(--accent); }
    .sidebar.collapsed .sidebar-toggle { margin-left: 0; transform: rotate(180deg); color: var(--muted); }
    .sidebar.collapsed .sidebar-toggle:hover { color: var(--accent); background: var(--accent-soft); }
    .sidebar-toggle svg { width: 18px; height: 18px; }

    .new-note-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: var(--radius);
      background: var(--accent-gradient);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 20px;
      transition: all 0.2s;
      white-space: nowrap;
      border: none;
      width: 100%;
      box-shadow: 0 3px 10px var(--accent-soft);
    }
    .new-note-btn:hover { box-shadow: 0 5px 18px var(--accent-soft); transform: translateY(-1px); }
    .new-note-btn svg { width: 18px; height: 18px; }
    .sidebar.collapsed .new-note-btn { padding: 11px 0; }
    .sidebar.collapsed .new-note-btn span { display: none; }
    .sidebar.collapsed .new-note-btn svg { margin: 0; }

    .nav-section { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      transition: all 0.15s;
      white-space: nowrap;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover { background: var(--accent-soft); color: var(--fg); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .sidebar.collapsed .nav-item { justify-content: center; padding: 10px 0; }
    .sidebar.collapsed .nav-item span { display: none; }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: auto;
    }
    .user-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px;
      border-radius: var(--radius);
      white-space: nowrap;
      overflow: hidden;
    }
    .user-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: grid; place-items: center;
      color: #fff; font-size: 14px; font-weight: 700;
      flex-shrink: 0;
    }
    .user-info { overflow: hidden; flex: 1; }
    .user-info .name { font-size: 13px; font-weight: 600; }
    .user-info .email { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar.collapsed .user-info { display: none; }
    .sidebar-footer-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      padding-inline: 4px;
    }
    .sidebar.collapsed .sidebar-footer-actions { flex-direction: column; }
    .footer-action-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: grid; place-items: center;
      color: var(--muted);
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .footer-action-btn:hover { background: var(--accent-soft); color: var(--accent); }
    .footer-action-btn svg { width: 18px; height: 18px; }
    .footer-action-btn .moon-icon { display: none; }
    [data-theme="dark"] .footer-action-btn .sun-icon { display: none; }
    [data-theme="dark"] .footer-action-btn .moon-icon { display: block; }
    .logout-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      transition: all 0.15s;
      white-space: nowrap;
      border: none;
      background: none;
      cursor: pointer;
      margin-left: auto;
    }
    .logout-btn:hover { color: var(--danger); background: var(--danger-soft); }
    .logout-btn svg { width: 18px; height: 18px; }
    .sidebar.collapsed .logout-btn span { display: none; }
    .sidebar.collapsed .logout-btn { justify-content: center; padding: 8px; margin-left: 0; }

    /* ---- Mobile overlay sidebar ---- */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }

    /* ---- Main content ---- */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      gap: 16px;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .mobile-menu-btn {
      display: none;
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mobile-menu-btn svg { width: 20px; height: 20px; }
    .topbar-title h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
    .topbar-title p { font-size: 13px; color: var(--muted); margin: 0; }
    .topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .search-wrap {
      position: relative;
      width: 220px;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 13px;
      transition: all 0.2s;
    }
    .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search-wrap input::placeholder { color: var(--muted); }
    .view-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      flex-shrink: 0;
    }
    .view-btn {
      padding: 7px 12px;
      background: transparent;
      color: var(--muted);
      transition: all 0.15s;
      display: grid; place-items: center;
      border: none;
      cursor: pointer;
    }
    .view-btn svg { width: 16px; height: 16px; }
    .view-btn.active { background: var(--accent-soft); color: var(--accent); }
    .view-btn:hover:not(.active) { color: var(--fg); }
    .sort-wrap {
      position: relative;
    }
    .sort-select {
      padding: 9px 32px 9px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .sort-wrap svg {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--muted);
      pointer-events: none;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .content-area.empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    /* ---- Notes area ---- */
    .notes-area { display: block; }
    .notes-area.hidden { display: none; }
    .empty-state-icon { margin-bottom: 16px; }
    .empty-state-icon svg { width: 80px; height: 80px; color: var(--muted); opacity: 0.3; }
    .empty-state h2 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
    .empty-state p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

    /* Grid view */
    .note-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 1100px) { .note-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .note-grid { grid-template-columns: 1fr; } }
    .note-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
    }
    .note-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-soft);
    }
    .note-card-star {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 28px; height: 28px;
      border-radius: 6px;
      display: grid; place-items: center;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      background: none;
      border: none;
    }
    .note-card-star:hover { background: var(--accent-soft); }
    .note-card-star.favorited svg { fill: var(--star); stroke: var(--star); }
    .note-card-star svg { width: 16px; height: 16px; }
    .note-card-category {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 5px;
      background: var(--accent-soft);
      color: var(--accent);
      display: inline-block;
      margin-bottom: 12px;
    }
    .note-card h3 { font-size: 15px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; padding-right: 28px; }
    .note-card p { font-size: 13px; color: var(--muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
    .note-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    .note-card-tags { display: flex; gap: 4px; }
    .note-tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--bg);
      color: var(--muted);
    }
    .note-card-date { font-size: 11px; color: var(--muted); }

    /* List view */
    .note-list { display: flex; flex-direction: column; gap: 2px; }
    .note-list-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .note-list-item:hover { background: var(--accent-soft); }
    .note-list-item .list-star {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: grid; place-items: center;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
      background: none;
      border: none;
      transition: all 0.15s;
    }
    .note-list-item .list-star:hover { background: var(--surface); }
    .note-list-item .list-star.favorited svg { fill: var(--star); stroke: var(--star); }
    .note-list-item .list-star svg { width: 16px; height: 16px; }
    .note-list-item .list-title { font-size: 14px; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-list-item .list-preview { font-size: 13px; color: var(--muted); flex: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-list-item .list-date { font-size: 12px; color: var(--muted); flex-shrink: 0; }
    .note-list-item .list-trash {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: grid; place-items: center;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: all 0.15s;
      background: none;
      border: none;
    }
    .note-list-item:hover .list-trash { opacity: 1; }
    .note-list-item .list-trash:hover { color: var(--danger); background: var(--danger-soft); }
    .note-list-item .list-trash svg { width: 16px; height: 16px; }

    /* ---- Todo view ---- */
    .todo-view {
      display: none;
      flex-direction: column;
      height: 100%;
    }
    .todo-view.active { display: flex; }
    .todo-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .todo-add-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }
    .todo-add-wrap input {
      flex: 1;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .todo-add-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .todo-add-wrap input::placeholder { color: var(--muted); }
    .todo-add-btn {
      padding: 10px 18px;
      border-radius: var(--radius);
      background: var(--accent-gradient);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 10px var(--accent-soft);
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }
    .todo-add-btn:hover { box-shadow: 0 5px 18px var(--accent-soft); transform: translateY(-1px); }
    .todo-add-btn svg { width: 16px; height: 16px; }
    .todo-filters {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .todo-filter-chip {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: all 0.15s;
    }
    .todo-filter-chip:hover { border-color: var(--accent); color: var(--fg); }
    .todo-filter-chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); font-weight: 600; }
    .todo-sort-select {
      padding: 6px 28px 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--fg);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .todo-sort-wrap { position: relative; }
    .todo-sort-wrap svg {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      color: var(--muted);
      pointer-events: none;
    }
    .todo-list { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .todo-item:hover { border-color: var(--accent-soft); box-shadow: var(--shadow-sm); }
    .todo-item.completed { opacity: 0.65; }
    .todo-item.completed .todo-text { text-decoration: line-through; }
    .todo-checkbox {
      width: 24px; height: 24px;
      border-radius: 6px;
      border: 2px solid var(--border);
      display: grid; place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      background: none;
      color: transparent;
    }
    .todo-checkbox:hover { border-color: var(--accent); }
    .todo-checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .todo-checkbox svg { width: 14px; height: 14px; }
    .todo-text {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .todo-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .todo-due {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      padding: 3px 8px;
      border-radius: 5px;
      background: var(--bg);
    }
    .todo-due svg { width: 12px; height: 12px; }
    .todo-due.overdue { color: var(--danger); background: var(--danger-soft); }
    .todo-priority {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .todo-priority.high { background: var(--high-soft); color: var(--high); }
    .todo-priority.medium { background: var(--medium-soft); color: var(--medium); }
    .todo-priority.low { background: var(--low-soft); color: var(--low); }
    .todo-more-btn {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: grid; place-items: center;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: all 0.15s;
      background: none;
      border: none;
    }
    .todo-item:hover .todo-more-btn { opacity: 1; }
    .todo-more-btn:hover { background: var(--accent-soft); color: var(--accent); }
    .todo-more-btn svg { width: 16px; height: 16px; }
    .todo-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      text-align: center;
    }
    .todo-empty-state svg { width: 64px; height: 64px; color: var(--muted); opacity: 0.3; margin-bottom: 16px; }
    .todo-empty-state h3 { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
    .todo-empty-state p { font-size: 13px; color: var(--muted); margin: 0; }
    .todo-progress-wrap { margin-bottom: 20px; }
    .todo-progress-bar {
      height: 4px;
      border-radius: 4px;
      background: var(--border);
      overflow: hidden;
      margin-bottom: 6px;
    }
    .todo-progress-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    .todo-progress-text { font-size: 12px; color: var(--muted); }

    /* ---- Todo widget (sidebar bottom) ---- */
    .todo-widget {
      padding: 12px 8px;
      border-top: 1px solid var(--border);
    }
    .sidebar.collapsed .todo-widget { display: none; }
    .todo-widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .todo-widget-header h4 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0;
    }
    .todo-widget-header a {
      font-size: 11px;
      color: var(--accent);
      font-weight: 500;
      cursor: pointer;
    }
    .todo-widget-header a:hover { text-decoration: underline; }
    .todo-widget-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      font-size: 12px;
    }
    .todo-widget-item .tw-checkbox {
      width: 16px; height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--border);
      display: grid; place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      background: none;
      color: transparent;
      transition: all 0.15s;
    }
    .todo-widget-item .tw-checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .todo-widget-item .tw-checkbox svg { width: 10px; height: 10px; }
    .todo-widget-item .tw-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .todo-widget-item .tw-text.done { text-decoration: line-through; }
    .todo-widget-item .tw-due { font-size: 10px; color: var(--muted); flex-shrink: 0; }
    .no-todo-widget { font-size: 12px; color: var(--muted); text-align: center; padding: 8px 0; }

    /* ---- Editor Modal ---- */
    .overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .editor-modal, .todo-modal {
      position: fixed; inset: 0; z-index: 300;
      display: grid; place-items: center;
      padding: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .editor-modal.open, .todo-modal.open { opacity: 1; pointer-events: auto; }
    .editor-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      width: 100%;
      max-width: 760px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      transform: translateY(16px) scale(0.98);
      transition: transform 0.3s cubic-bezier(0.23,1,0.32,1);
      overflow: hidden;
    }
    .editor-modal.open .editor-panel, .todo-modal.open .todo-panel { transform: translateY(0) scale(1); }
    .editor-topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .editor-back {
      width: 34px; height: 34px;
      border-radius: 8px;
      display: grid; place-items: center;
      color: var(--muted);
      transition: all 0.15s;
      border: none;
      background: none;
      cursor: pointer;
    }
    .editor-back:hover { background: var(--accent-soft); color: var(--accent); }
    .editor-back svg { width: 20px; height: 20px; }
    .editor-title-input {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      padding: 8px 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
    }
    .editor-title-input::placeholder { color: var(--muted); }
    .editor-actions { display: flex; align-items: center; gap: 4px; }
    .editor-action-btn {
      width: 34px; height: 34px;
      border-radius: 8px;
      display: grid; place-items: center;
      color: var(--muted);
      transition: all 0.15s;
      border: none;
      background: none;
      cursor: pointer;
    }
    .editor-action-btn:hover { background: var(--accent-soft); color: var(--accent); }
    .editor-action-btn.favorited svg { fill: var(--star); stroke: var(--star); }
    .editor-action-btn svg { width: 18px; height: 18px; }
    .editor-saved { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
    .editor-saved svg { width: 14px; height: 14px; color: var(--success); }

    .editor-toolbar {
      display: flex; align-items: center; gap: 2px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .toolbar-btn {
      width: 32px; height: 32px;
      border-radius: 6px;
      display: grid; place-items: center;
      color: var(--muted);
      transition: all 0.15s;
      border: none;
      background: none;
      cursor: pointer;
    }
    .toolbar-btn:hover { background: var(--accent-soft); color: var(--fg); }
    .toolbar-btn.active { background: var(--accent-soft); color: var(--accent); }
    .toolbar-btn svg { width: 16px; height: 16px; }
    .toolbar-sep {
      width: 1px; height: 20px;
      background: var(--border);
      margin: 0 4px;
    }
    .editor-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      min-height: 200px;
    }
    .editor-textarea {
      width: 100%;
      min-height: 200px;
      border: none;
      outline: none;
      resize: vertical;
      font-size: 15px;
      line-height: 1.7;
      color: var(--fg);
      background: transparent;
    }
    .editor-textarea::placeholder { color: var(--muted); }
    .editor-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .editor-footer svg { width: 14px; height: 14px; color: var(--success); }

    /* ---- Todo modal ---- */
    .todo-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      width: 100%;
      max-width: 520px;
      padding: 24px;
      transform: translateY(16px) scale(0.98);
      transition: transform 0.3s cubic-bezier(0.23,1,0.32,1);
    }
    .todo-modal.open .todo-panel { transform: translateY(0) scale(1); }
    .todo-panel h2 { font-size: 20px; font-weight: 700; margin: 0 0 20px; letter-spacing: -0.02em; }
    .todo-form-group { margin-bottom: 16px; }
    .todo-form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--fg);
    }
    .todo-form-group input, .todo-form-group textarea, .todo-form-group select {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .todo-form-group select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      padding-right: 36px;
    }
    .todo-form-group input:focus, .todo-form-group textarea:focus, .todo-form-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      outline: none;
    }
    .todo-form-group select:hover { border-color: var(--muted); }
    .todo-select-wrap {
      position: relative;
    }
    .todo-select-wrap svg {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--muted);
      pointer-events: none;
    }
    .todo-form-group textarea { resize: vertical; min-height: 80px; }
    .todo-form-row {
      display: flex;
      gap: 12px;
    }
    .todo-form-row .todo-form-group { flex: 1; }
    .todo-form-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .todo-form-btn {
      padding: 10px 20px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }
    .todo-form-btn.primary { background: var(--accent-gradient); color: #fff; box-shadow: 0 3px 10px var(--accent-soft); }
    .todo-form-btn.primary:hover { box-shadow: 0 5px 18px var(--accent-soft); }
    .todo-form-btn.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .todo-form-btn.secondary:hover { border-color: var(--fg); color: var(--fg); }
    .todo-form-btn.danger { background: var(--danger-soft); color: var(--danger); }
    .todo-form-btn.danger:hover { background: var(--danger); color: #fff; }
    .todo-form-error {
      font-size: 12px;
      color: var(--danger);
      margin-top: 4px;
    }

    /* ---- Toast ---- */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
      box-shadow: var(--shadow-lg);
      z-index: 500;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.23,1,0.32,1);
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast-success { border-left: 4px solid var(--success); }
    .toast-error { border-left: 4px solid var(--danger); }
    .toast-info { border-left: 4px solid var(--accent); }

    /* ---- Mobile bottom nav ---- */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      z-index: 80;
      padding: 6px 0 env(safe-area-inset-bottom, 6px);
    }
    .mobile-nav-inner { display: flex; align-items: center; justify-content: space-around; }
    .mobile-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      font-size: 10px;
      font-weight: 500;
    }
    .mobile-nav-btn svg { width: 22px; height: 22px; }
    .mobile-nav-btn.active { color: var(--accent); }
    .mobile-nav-btn.mobile-new-btn svg { color: #fff; }
    .mobile-nav-btn.mobile-new-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--accent-gradient);
      box-shadow: 0 4px 14px var(--accent-soft);
      margin-top: -16px;
    }

    /* ---- Responsive ---- */
    @media (max-width: 820px) {
      .sidebar { display: none; }
      .sidebar-overlay { display: block; }
      .mobile-nav { display: block; }
      .mobile-menu-btn { display: flex; }
      .topbar { padding: 12px 16px; }
      .notes-area { padding: 16px; padding-bottom: 80px; }
      .search-wrap { width: 140px; }
      .editor-panel { max-height: 92vh; border-radius: var(--radius); margin: 0; }
      .editor-modal { padding: 8px; }
      .todo-header { flex-direction: column; align-items: stretch; }
      .todo-filters { flex-wrap: wrap; }
    }
    @media (max-width: 480px) {
      .search-wrap { width: 100%; order: 3; }
      .topbar { flex-wrap: wrap; }
      .topbar-right { width: 100%; }
    }

    /* ---- Mobile sidebar open ---- */
    .mobile-sidebar-open .sidebar {
      display: flex;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 280px;
      z-index: 95;
      box-shadow: var(--shadow-xl);
    }

    /* ---- Bell / notification ---- */
    .bell-wrap { position: relative; }
    .bell-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--glass-bg);
      display: grid; place-items: center;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .bell-btn:hover { border-color: var(--accent); color: var(--accent); }
    .bell-btn svg { width: 20px; height: 20px; }
    .bell-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--danger);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      box-shadow: 0 0 0 2px var(--surface);
    }

    /* ---- Notification panel ---- */
    .notif-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 380px;
      max-height: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      z-index: 150;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: all 0.25s cubic-bezier(0.23,1,0.32,1);
      overflow: hidden;
    }
    .notif-panel.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .notif-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .notif-panel-header h3 { font-size: 15px; font-weight: 600; margin: 0; }
    .notif-mark-read {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .notif-mark-read:hover { text-decoration: underline; }
    .notif-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .notif-item {
      display: flex;
      gap: 12px;
      padding: 12px 18px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid color-mix(in oklch, var(--border) 50%, transparent);
    }
    .notif-item:hover { background: var(--accent-soft); }
    .notif-item.unread { background: var(--accent-soft); }
    .notif-item.unread .notif-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      margin-top: 4px;
    }
    .notif-item .notif-dot-empty { width: 8px; flex-shrink: 0; }
    .notif-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--accent-soft);
      display: grid; place-items: center;
      color: var(--accent);
      flex-shrink: 0;
    }
    .notif-icon svg { width: 16px; height: 16px; }
    .notif-content { flex: 1; min-width: 0; }
    .notif-msg { font-size: 13px; line-height: 1.4; margin: 0 0 2px; }
    .notif-time { font-size: 11px; color: var(--muted); }
    .notif-footer {
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      text-align: center;
      flex-shrink: 0;
    }
    .notif-footer a {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
      cursor: pointer;
    }
    .notif-footer a:hover { text-decoration: underline; }
    .notif-empty {
      padding: 48px 24px;
      text-align: center;
    }
    .notif-empty svg { width: 48px; height: 48px; color: var(--muted); opacity: 0.3; margin: 0 auto 12px; }
    .notif-empty h4 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
    .notif-empty p { font-size: 13px; color: var(--muted); margin: 0; }

    /* ---- Utilities ---- */
    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Desktop Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-header">
          <a href="/" class="sidebar-logo">
            <span>Notelify</span>
          </a>
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="Collapse sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"/><polyline points="15 6 9 12 15 18"/>
            </svg>
          </button>
        </div>

        <button class="new-note-btn" id="newNoteBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>New Note</span>
        </button>

        <nav class="nav-section">
          <button class="nav-item active" data-nav="all">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span>All Notes</span>
          </button>
          <button class="nav-item" data-nav="favorites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span>Favorites</span>
          </button>
          <button class="nav-item" data-nav="todos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
            <span>Todos</span>
          </button>
          <button class="nav-item" data-nav="trash">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            <span>Trash</span>
          </button>
          <button class="nav-item" data-nav="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <span>Settings</span>
          </button>
        </nav>

        <div class="todo-widget" id="todoWidget">
          <div class="todo-widget-header">
            <h4>Upcoming Todos</h4>
            <a id="viewAllTodos">View all</a>
          </div>
          <div id="todoWidgetList"></div>

      function redirectToLogin() {

      function showToast(msg, type) {
        toast.textContent = msg;
        toast.className = 'toast toast-' + (type || 'info');
        toast.classList.add('show');
        clearTimeout(toast._hide);
        toast._hide = setTimeout(function () { toast.classList.remove('show'); }, 2500);
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str || ''));
        return div.innerHTML;
      }

      function themeInit() {
        var theme = localStorage.getItem('notelify-theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      }

      function toggleTheme() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('notelify-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('notelify-theme', 'dark');
        }
      }

      function authJson(url, options) {
        return window.NotelifyAuth.authFetch(url, options || {})
          .then(function (res) {
            return res.text().then(function (raw) {
              var data = {};
              if (raw) {
                try {
                  data = JSON.parse(raw);
                } catch (e) {
                  data = {};
                }
              }
              if (!res.ok) {
                var err = new Error(data.message || ('Request failed (' + res.status + ')'));
                err.status = res.status;
                throw err;
              }
              return data;
            });
          });
      }

      function formatRelative(dateStr) {
        if (!dateStr) {
          return 'Recently';
        }
        var date = new Date(dateStr);
        var now = new Date();
        var diff = now - date;
        var day = 24 * 60 * 60 * 1000;
        if (diff < day) return 'Today';
        if (diff < 2 * day) return 'Yesterday';
        if (diff < 7 * day) return Math.floor(diff / day) + 'd ago';
        return date.toLocaleDateString();
      }

      function closeMobileMenu() {
        document.body.classList.remove('mobile-sidebar-open');
        sidebarOverlay.classList.remove('open');
      }

      function setupUser(profile) {
        var username = profile.username || 'User';
        var email = profile.email || '';
        document.getElementById('sidebarAvatar').textContent = username.charAt(0).toUpperCase();
        document.getElementById('sidebarName').textContent = username;
        document.getElementById('sidebarEmail').textContent = email;
      }

      function switchNav(nav) {
        currentNav = nav;
        document.querySelectorAll('.nav-item').forEach(function (b) { b.classList.toggle('active', b.dataset.nav === nav); });
        document.querySelectorAll('.mobile-nav-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.mnav === nav); });
        var titles = { all: 'All Notes', favorites: 'Favorites', trash: 'Trash', settings: 'Settings', todos: 'Todos' };
        sectionTitle.textContent = titles[nav] || 'Notes';
        if (nav === 'todos') {
          notesArea.classList.add('hidden');
          todoView.classList.add('active');
          contentArea.classList.remove('empty-state');
          renderTodos();
        } else {
          notesArea.classList.remove('hidden');
          todoView.classList.remove('active');
          loadAndRenderNotes();
        }
      }

      function updateCount(count) {
        if (currentNav === 'favorites') {
          sectionSub.textContent = count + ' favorite' + (count !== 1 ? 's' : '');
          return;
        }
        if (currentNav === 'trash') {
          sectionSub.textContent = count + ' trashed';
          return;
        }
        sectionSub.textContent = count + ' note' + (count !== 1 ? 's' : '');
      }

      function currentNoteViewParam() {
        if (currentNav === 'favorites') return 'favorites';
        if (currentNav === 'trash') return 'trash';
        return 'all';
      }

      function loadAndRenderNotes() {
        var query = encodeURIComponent(searchInput.value.trim());
        var sort = encodeURIComponent(sortSelect.value);
        var view = encodeURIComponent(currentNoteViewParam());
        return authJson('/api/notes?view=' + view + '&search=' + query + '&sort=' + sort)
          .then(function (data) {
            notes = Array.isArray(data) ? data : [];
            renderNotes();
          })
          .catch(function (err) {
            if (err.message === 'AUTH_REQUIRED') {
              redirectToLogin();
              return;
            }
            showToast(err.message || 'Failed to load notes.', 'error');
          });
      }

      function renderNotes() {
        var list = notes.slice();
        if (list.length === 0) {
          notesArea.className = 'notes-area empty-state';
          notesArea.innerHTML =
            '<div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>' +
            '<h2>No notes found</h2>' +
            '<p>Create a new note to get started.</p>';
          updateCount(0);
          return;
        }

        notesArea.className = 'notes-area';
        if (notesArea.firstElementChild && notesArea.firstElementChild.id !== 'notesContainer') {
          notesArea.innerHTML = '<div class="note-grid" id="notesContainer"></div>';
          container = document.getElementById('notesContainer');
        }

        if (currentView === 'grid') {
          container.className = 'note-grid';
          container.innerHTML = list.map(function (n) {
            return '<div class="note-card fade-in" data-id="' + n.id + '">' +
              '<button class="note-card-star' + (n.favorited ? ' favorited' : '') + '" data-action="star" data-id="' + n.id + '">' +
                '<svg viewBox="0 0 24 24" fill="' + (n.favorited ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' +
              '</button>' +
              '<span class="note-card-category">' + escapeHtml(n.category) + '</span>' +
              '<h3>' + escapeHtml(n.title) + '</h3>' +
              '<p>' + escapeHtml(n.content) + '</p>' +
              '<div class="note-card-footer">' +
                '<div class="note-card-tags">' + (n.tags || []).slice(0, 3).map(function (t) { return '<span class="note-tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' +
                '<span class="note-card-date">' + formatRelative(n.updatedAt) + '</span>' +
              '</div>' +
            '</div>';
          }).join('');
        } else {
          container.className = 'note-list';
          container.innerHTML = list.map(function (n) {
            return '<div class="note-list-item fade-in" data-id="' + n.id + '">' +
              '<button class="list-star' + (n.favorited ? ' favorited' : '') + '" data-action="star" data-id="' + n.id + '">' +
                '<svg viewBox="0 0 24 24" fill="' + (n.favorited ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' +
              '</button>' +
              '<span class="list-title">' + escapeHtml(n.title) + '</span>' +
              '<span class="list-preview">' + escapeHtml(n.content) + '</span>' +
              '<span class="list-date">' + formatRelative(n.updatedAt) + '</span>' +
              '<button class="list-trash" data-action="trash" data-id="' + n.id + '">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
              '</button>' +
            '</div>';
          }).join('');
        }
        updateCount(list.length);
        attachNoteEvents();
      }

      function attachNoteEvents() {
        container.querySelectorAll('[data-id]').forEach(function (item) {
          item.addEventListener('click', function (e) {
            var actionTarget = e.target.closest('[data-action]');
            if (actionTarget) {
              var action = actionTarget.dataset.action;
              var id = parseInt(actionTarget.dataset.id, 10);
              if (action === 'star') {
                toggleFav(id);
              }
              if (action === 'trash') {
                deleteNote(id);
              }
              return;
            }
            openEditor(parseInt(item.dataset.id, 10));
          });
        });
      }

      function openEditor(id) {
        editingNoteId = id;
        var note = notes.find(function (n) { return n.id === id; });
        if (!note) {
          return;
        }
        editorTitle.value = note.title;
        editorBody.value = note.content;
        editorStarBtn.classList.toggle('favorited', !!note.favorited);
        editorStarBtn.querySelector('svg').setAttribute('fill', note.favorited ? 'currentColor' : 'none');
        editorOverlay.classList.add('open');
        editorModal.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function saveCurrentNote() {
        if (editingNoteId == null) {
          return Promise.resolve();
        }
        var note = notes.find(function (n) { return n.id === editingNoteId; });
        if (!note) {
          return Promise.resolve();
        }
        return authJson('/api/notes/' + editingNoteId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: editorTitle.value.trim() || 'Untitled',
            content: editorBody.value.trim() || 'No content',
            category: note.category || 'Personal',
            tags: note.tags || [],
            favorited: !!note.favorited
          })
        }).then(function (updated) {
          for (var i = 0; i < notes.length; i++) {
            if (notes[i].id === updated.id) {
              notes[i] = updated;
              break;
            }
          }
          editorSaved.querySelector('span').textContent = 'Saved';
          editorTimestamp.textContent = 'Last saved just now';
        });
      }

      function closeEditor() {
        clearTimeout(saveTimer);
        saveCurrentNote().finally(function () {
          editorOverlay.classList.remove('open');
          editorModal.classList.remove('open');
          document.body.style.overflow = '';
          editingNoteId = null;
          renderNotes();
        });
      }

      function toggleFav(id) {
        var note = notes.find(function (n) { return n.id === id; });
        if (!note) return;
        authJson('/api/notes/' + id + '/favorite', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: !note.favorited })
        }).then(function () {
          loadAndRenderNotes();
        }).catch(function (err) {
          showToast(err.message || 'Could not update favorite.', 'error');
        });
      }

      function deleteNote(id) {
        var inTrash = currentNav === 'trash';
        var req = inTrash
          ? authJson('/api/notes/' + id, { method: 'DELETE' })
          : authJson('/api/notes/' + id + '/deleted', {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ value: true })
            });

        req.then(function () {
          showToast(inTrash ? 'Note deleted permanently.' : 'Note moved to trash.', 'info');
          loadAndRenderNotes();
        }).catch(function (err) {
          showToast(err.message || 'Could not delete note.', 'error');
        });
      }

      function createNewNote() {
        authJson('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: 'Untitled',
            content: 'Start writing...',
            category: 'Personal',
            tags: ['new'],
            favorited: false
          })
        }).then(function (note) {
          notes.unshift(note);
          renderNotes();
          openEditor(note.id);
        }).catch(function (err) {
          showToast(err.message || 'Could not create note.', 'error');
        });
      }

      function getFilteredTodos() {
        var list = todos.slice();
        if (currentTodoFilter === 'pending') list = list.filter(function (t) { return !t.completed; });
        if (currentTodoFilter === 'completed') list = list.filter(function (t) { return t.completed; });
        if (currentTodoSort === 'priority') {
          var order = { high: 0, medium: 1, low: 2 };
          list.sort(function (a, b) { return (order[a.priority] || 1) - (order[b.priority] || 1); });
        } else if (currentTodoSort === 'created') {
          list.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
        } else {
          list.sort(function (a, b) {
            if (!a.dueDate && !b.dueDate) return 0;
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
          });
        }
        return list;
      }

      function renderTodos() {
        var list = getFilteredTodos();
        var total = todos.length;
        var done = todos.filter(function (t) { return t.completed; }).length;
        var pct = total === 0 ? 0 : Math.round(done / total * 100);
        todoProgressFill.style.width = pct + '%';
        todoProgressText.textContent = done + ' of ' + total + ' completed';

        if (list.length === 0) {
          todoList.innerHTML =
            '<div class="todo-empty-state">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>' +
            '<h3>No tasks yet</h3><p>Create a task to get started.</p></div>';
          renderWidget();
          renderNotifications();
          return;
        }

        todoList.innerHTML = list.map(function (t) {
          var isOverdue = t.dueDate && !t.completed && t.dueDate < todayStr();
          return '<div class="todo-item' + (t.completed ? ' completed' : '') + '" data-tid="' + t.id + '">' +
            '<button class="todo-checkbox' + (t.completed ? ' checked' : '') + '" data-taction="toggle" data-tid="' + t.id + '">' +
              (t.completed ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : '') +
            '</button>' +
            '<span class="todo-text">' + escapeHtml(t.title) + '</span>' +
            '<div class="todo-meta">' +
              (t.dueDate ? '<span class="todo-due' + (isOverdue ? ' overdue' : '') + '">' + t.dueDate + '</span>' : '') +
              '<span class="todo-priority ' + t.priority + '">' + t.priority + '</span>' +
            '</div>' +
            '<button class="todo-more-btn" data-taction="edit" data-tid="' + t.id + '">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>' +
            '</button>' +
          '</div>';
        }).join('');

        todoList.querySelectorAll('[data-taction]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var id = parseInt(btn.dataset.tid, 10);
            if (btn.dataset.taction === 'toggle') {
              toggleTodo(id);
            }
            if (btn.dataset.taction === 'edit') {
              openTodoModal(id);
            }
          });
        });

        renderWidget();
        renderNotifications();
      }

      function loadTodos() {
        return authJson('/api/todos')
          .then(function (data) {
            todos = Array.isArray(data) ? data : [];
            renderTodos();
          })
          .catch(function (err) {
            showToast(err.message || 'Failed to load tasks.', 'error');
          });
      }

      function toggleTodo(id) {
        var todo = todos.find(function (t) { return t.id === id; });
        if (!todo) return;
        authJson('/api/todos/' + id + '/completed', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: !todo.completed })
        }).then(function () {
          loadTodos();
        }).catch(function (err) {
          showToast(err.message || 'Could not update task.', 'error');
        });
      }

      function openTodoModal(id) {
        editingTodoId = id;
        var todo = todos.find(function (t) { return t.id === id; });
        if (todo) {
          todoModalTitle.textContent = 'Edit Task';
          todoFormTitle.value = todo.title || '';
          todoFormDesc.value = todo.description || '';
          todoFormDue.value = todo.dueDate || '';
          todoFormPriority.value = todo.priority || 'medium';
          todoFormReminder.value = String(todo.reminderDays || 0);
          todoFormDelete.classList.remove('hidden');
        } else {
          todoModalTitle.textContent = 'Add Task';
          todoFormTitle.value = '';
          todoFormDesc.value = '';
          todoFormDue.value = '';
          todoFormPriority.value = 'medium';
          todoFormReminder.value = '0';
          todoFormDelete.classList.add('hidden');
        }
        todoFormTitleError.classList.add('hidden');
        editorOverlay.classList.add('open');
        todoModal.classList.add('open');
      }

      function closeTodoModal() {
        editorOverlay.classList.remove('open');
        todoModal.classList.remove('open');
        editingTodoId = null;
      }

      function saveTodoForm() {
        var title = todoFormTitle.value.trim();
        if (!title) {
          todoFormTitleError.classList.remove('hidden');
          return;
        }
        var payload = {
          title: title,
          description: todoFormDesc.value.trim(),
          dueDate: todoFormDue.value || null,
          priority: todoFormPriority.value,
          reminderDays: parseInt(todoFormReminder.value, 10) || 0
        };
        var req = editingTodoId == null
          ? authJson('/api/todos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
          : authJson('/api/todos/' + editingTodoId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

        req.then(function () {
          closeTodoModal();
          loadTodos();
          showToast(editingTodoId == null ? 'Task added.' : 'Task updated.', 'success');
        }).catch(function (err) {
          showToast(err.message || 'Could not save task.', 'error');
        });
      }

      function deleteTodo(id) {
        authJson('/api/todos/' + id, { method: 'DELETE' })
          .then(function () {
            closeTodoModal();
            loadTodos();
            showToast('Task deleted.', 'info');
          })
          .catch(function (err) {
            showToast(err.message || 'Could not delete task.', 'error');
          });
      }

      function todayStr() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      function daysUntilDate(dateStr) {
        if (!dateStr) {
          return null;
        }
        var today = new Date();
        var due = new Date(dateStr + 'T00:00:00');
        if (Number.isNaN(due.getTime())) {
          return null;
        }
        var todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        var diff = due.getTime() - todayStart.getTime();
        return Math.floor(diff / (24 * 60 * 60 * 1000));
      }

      function buildNotifications() {
        notifications = [];
        todos.forEach(function (t) {
          if (t.completed) return;
          var daysUntilDue = daysUntilDate(t.dueDate);
          if (daysUntilDue == null) return;

          if (daysUntilDue < 0) {
            notifications.push({ id: 'overdue-' + t.id, message: 'Task "' + t.title + '" is overdue', type: 'due', time: 'Overdue' });
            return;
          }

          if (daysUntilDue === 0) {
            notifications.push({ id: 'due-' + t.id, message: 'Task "' + t.title + '" is due today', type: 'due', time: 'Today' });
            return;
          }

          var reminderDays = Number(t.reminderDays || 0);
          if (reminderDays > 0 && daysUntilDue === reminderDays) {
            notifications.push({
              id: 'reminder-' + t.id,
              message: 'Task "' + t.title + '" is due in ' + reminderDays + ' day' + (reminderDays === 1 ? '' : 's'),
              type: 'reminder',
              time: 'Reminder'
            });
          }
        });
      }

      function renderNotifications() {
        buildNotifications();
        if (notifications.length === 0) {
          notifList.innerHTML = '<div class="notif-empty"><h4>No notifications</h4><p>You\'re all caught up.</p></div>';
          bellBadge.style.display = 'none';
          return;
        }
        var unreadCount = notifications.filter(function (n) { return !readNotifIds.has(n.id); }).length;
        bellBadge.textContent = unreadCount;
        bellBadge.style.display = unreadCount > 0 ? '' : 'none';
        notifList.innerHTML = notifications.map(function (n) {
          var unread = !readNotifIds.has(n.id);
          return '<div class="notif-item' + (unread ? ' unread' : '') + '" data-nid="' + n.id + '">' +
            (unread ? '<div class="notif-dot"></div>' : '<div class="notif-dot-empty"></div>') +
            '<div class="notif-content"><p class="notif-msg">' + escapeHtml(n.message) + '</p><span class="notif-time">' + n.time + '</span></div>' +
          '</div>';
        }).join('');
        notifList.querySelectorAll('.notif-item').forEach(function (item) {
          item.addEventListener('click', function () {
            readNotifIds.add(item.dataset.nid);
            renderNotifications();
          });
        });
      }

      function renderWidget() {
        var pending = todos.filter(function (t) { return !t.completed; }).slice(0, 3);
        if (pending.length === 0) {
          widgetTodoList.innerHTML = '<div class="no-todo-widget">All tasks completed!</div>';
          return;
        }
        widgetTodoList.innerHTML = pending.map(function (t) {
          return '<div class="todo-widget-item">' +
            '<button class="tw-checkbox" data-wtoggle="' + t.id + '"></button>' +
            '<span class="tw-text">' + escapeHtml(t.title) + '</span>' +
            (t.dueDate ? '<span class="tw-due">' + t.dueDate + '</span>' : '') +
          '</div>';
        }).join('');
        widgetTodoList.querySelectorAll('[data-wtoggle]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            toggleTodo(parseInt(btn.dataset.wtoggle, 10));
          });
        });
      }

      function setupEvents() {
        themeBtn.addEventListener('click', toggleTheme);
        document.getElementById('logoutBtn').addEventListener('click', function () {
          window.NotelifyAuth.logout().finally(function () {
            redirectToLogin();
          });
        });
        document.getElementById('newNoteBtn').addEventListener('click', createNewNote);
        document.getElementById('mobileNewBtn').addEventListener('click', createNewNote);
        searchInput.addEventListener('input', loadAndRenderNotes);
        sortSelect.addEventListener('change', loadAndRenderNotes);
        gridViewBtn.addEventListener('click', function () {
          currentView = 'grid';
          gridViewBtn.classList.add('active');
          listViewBtn.classList.remove('active');
          renderNotes();
        });
        listViewBtn.addEventListener('click', function () {
          currentView = 'list';
          listViewBtn.classList.add('active');
          gridViewBtn.classList.remove('active');
          renderNotes();
        });
        document.querySelectorAll('.nav-item').forEach(function (btn) {
          btn.addEventListener('click', function () {
            switchNav(btn.dataset.nav);
            closeMobileMenu();
          });
        });
        document.querySelectorAll('.mobile-nav-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (btn.classList.contains('mobile-new-btn')) return;
            switchNav(btn.dataset.mnav);
          });
        });
        sidebarToggle.addEventListener('click', function () {
          sidebar.classList.toggle('collapsed');
        });
        mobileMenuBtn.addEventListener('click', function () {
          document.body.classList.add('mobile-sidebar-open');
          sidebarOverlay.classList.add('open');
        });
        sidebarOverlay.addEventListener('click', closeMobileMenu);

        editorBack.addEventListener('click', closeEditor);
        editorOverlay.addEventListener('click', function () {
          if (editorModal.classList.contains('open')) closeEditor();
          if (todoModal.classList.contains('open')) closeTodoModal();
        });
        editorStarBtn.addEventListener('click', function () {
          if (editingNoteId == null) return;
          toggleFav(editingNoteId);
        });
        editorTrashBtn.addEventListener('click', function () {
          if (editingNoteId == null) return;
          deleteNote(editingNoteId);
          closeEditor();
        });
        editorTitle.addEventListener('input', function () {
          editorSaved.querySelector('span').textContent = 'Saving...';
          clearTimeout(saveTimer);
          saveTimer = setTimeout(saveCurrentNote, 700);
        });
        editorBody.addEventListener('input', function () {
          editorSaved.querySelector('span').textContent = 'Saving...';
          clearTimeout(saveTimer);
          saveTimer = setTimeout(saveCurrentNote, 700);
        });

        todoAddBtn.addEventListener('click', function () { openTodoModal(null); });
        todoFormSave.addEventListener('click', saveTodoForm);
        todoFormCancel.addEventListener('click', closeTodoModal);
        todoFormDelete.addEventListener('click', function () {
          if (editingTodoId != null) deleteTodo(editingTodoId);
        });
        todoSortSelect.addEventListener('change', function () {
          currentTodoSort = todoSortSelect.value;
          renderTodos();
        });
        document.querySelectorAll('.todo-filter-chip').forEach(function (chip) {
          chip.addEventListener('click', function () {
            document.querySelectorAll('.todo-filter-chip').forEach(function (c) { c.classList.remove('active'); });
            chip.classList.add('active');
            currentTodoFilter = chip.dataset.tfilter;
            renderTodos();
          });
        });

        bellBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          notifPanel.classList.toggle('open');
        });
        document.addEventListener('click', function (e) {
          if (!bellBtn.contains(e.target) && !notifPanel.contains(e.target)) {
            notifPanel.classList.remove('open');
          }
        });
        markAllRead.addEventListener('click', function () {
          notifications.forEach(function (n) { readNotifIds.add(n.id); });
          renderNotifications();
        });
        notifViewAllTodos.addEventListener('click', function () {
          notifPanel.classList.remove('open');
          switchNav('todos');
        });
        widgetViewAll.addEventListener('click', function () { switchNav('todos'); });
      }

      function loadProfileAndBootstrap() {
        window.NotelifyAuth.authFetch('/api/me')
          .then(function (res) {
            if (!res.ok) throw new Error('AUTH_REQUIRED');
            return res.json();
          })
          .then(function (profile) {
            setupUser(profile);
            setupEvents();
            return Promise.all([loadAndRenderNotes(), loadTodos()]);
          })
          .catch(function () {
            redirectToLogin();
          });
      }

      themeInit();
      loadProfileAndBootstrap();
    })();
  </script>
</body>
</html>
