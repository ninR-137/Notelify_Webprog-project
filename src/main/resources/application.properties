spring.config.import=optional:file:.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME:demo}

# Gmail SMTP configuration for OTP and reset emails
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

app.mail.from=${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
app.mail.api-key=${APP_MAIL_API_KEY:}
app.mail.api-url=${APP_MAIL_API_URL:https://api.resend.com/emails}
app.otp.ttl-minutes=${APP_OTP_TTL_MINUTES:5}

# JWT configuration
app.jwt.secret=${APP_JWT_SECRET:replace-this-with-a-long-random-secret-key-32chars-minimum}
app.jwt.access-token-minutes=${APP_JWT_ACCESS_TOKEN_MINUTES:15}
app.jwt.refresh-token-days=${APP_JWT_REFRESH_TOKEN_DAYS:7}

# Suppress noisy system font scan warnings from PDFBox/FontBox when Windows has corrupt fonts.
logging.level.org.apache.pdfbox.pdmodel.font.FileSystemFontProvider=ERROR
logging.level.org.apache.fontbox.ttf.TTFParser=ERROR
